<header class="barra-sesion">
  @if (!auth.cargando()) {
    @if (auth.usuario(); as usuario) {
      <span class="barra-sesion__nombre">{{ usuario.nombre }}</span>
      <button type="button" class="barra-sesion__accion" (click)="cerrarSesion()">Salir</button>
    } @else {
      <a class="barra-sesion__accion" routerLink="/login">Iniciar sesión</a>
    }
  }
</header>
