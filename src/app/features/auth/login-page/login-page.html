<header class="pagina-en-construccion__encabezado">
  <h1>{{ modo() === 'login' ? 'Ingresar' : 'Crear cuenta' }}</h1>
</header>

<section class="tarjeta login">
  <nav class="login__tabs">
    <button
      type="button"
      class="login__tab"
      [class.login__tab--activa]="modo() === 'login'"
      (click)="cambiarModo('login')"
    >
      Ya tengo cuenta
    </button>
    <button
      type="button"
      class="login__tab"
      [class.login__tab--activa]="modo() === 'registro'"
      (click)="cambiarModo('registro')"
    >
      Soy nuevo/a
    </button>
  </nav>

  <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()">
    @if (modo() === 'registro') {
      <label class="login__campo">
        <span>Nombre completo</span>
        <input type="text" formControlName="nombre" autocomplete="name" />
      </label>
    }

    <label class="login__campo">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="login__campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <button type="submit" class="boton-primario" [disabled]="enviando()">
      {{ enviando() ? 'Un momento…' : modo() === 'login' ? 'Ingresar' : 'Crear cuenta' }}
    </button>
  </form>
</section>

<p class="login__volver"><a routerLink="/inicio">Volver sin iniciar sesión</a></p>
