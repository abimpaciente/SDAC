<header class="pagina-en-construccion__encabezado">
  <h1>{{ modo() === 'login' ? 'Ingresar' : 'Crear cuenta' }}</h1>
</header>

<section class="tarjeta login">
  <button
    type="button"
    class="login__google"
    [disabled]="enviando()"
    (click)="continuarConGoogle()"
  >
    <svg viewBox="0 0 48 48" class="login__google-icono" aria-hidden="true">
      <path
        fill="#4285F4"
        d="M45.1 24.5c0-1.6-.1-3.1-.4-4.6H24v9h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.9 6.6-9.6 6.6-16.6Z"
      />
      <path
        fill="#34A853"
        d="M24 46c6 0 11-2 14.6-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.6-3.9-12.4-9.1H4.3v5.7C7.9 41.1 15.4 46 24 46Z"
      />
      <path
        fill="#FBBC05"
        d="M11.6 28.2c-.5-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.3C2.8 17 2 20.4 2 24s.8 7 2.3 9.9l7.3-5.7Z"
      />
      <path
        fill="#EA4335"
        d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.4 2 7.9 6.9 4.3 14.1l7.3 5.7c1.8-5.2 6.6-9.1 12.4-9.1Z"
      />
    </svg>
    Continuar con Google
  </button>

  <p class="login__separador"><span>o</span></p>

  <nav class="login__tabs">
    <button
      type="button"
      class="login__tab"
      [class.login__tab--activa]="modo() === 'login'"
      (click)="cambiarModo('login')"
    >
      Ya tengo cuenta
    </button>
    <button
      type="button"
      class="login__tab"
      [class.login__tab--activa]="modo() === 'registro'"
      (click)="cambiarModo('registro')"
    >
      Soy nuevo/a
    </button>
  </nav>

  <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()">
    @if (modo() === 'registro') {
      <label class="login__campo">
        <span>Nombre completo</span>
        <input type="text" formControlName="nombre" autocomplete="name" />
      </label>
    }

    <label class="login__campo">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="login__campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <button type="submit" class="boton-primario" [disabled]="enviando()">
      {{ enviando() ? 'Un momento…' : modo() === 'login' ? 'Ingresar' : 'Crear cuenta' }}
    </button>
  </form>
</section>

<p class="login__volver"><a routerLink="/inicio">Volver sin iniciar sesión</a></p>
